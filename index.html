<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.js"></script>
<style>
  :root{
    --paper: #121110;
    --paper-warm: #1A1815;
    --card: #201D19;
    --ink: #F3EEE4;
    --ink-soft: #A69C8C;
    --line: #35302A;
    --amber: #E8B84B;
    --amber-deep: #D6A233;
    --slate: #C9B77A;
    --slate-soft: #2A2620;
    --danger: #E08A6B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(217,154,43,0.05), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(92,107,122,0.06), transparent 45%);
    pointer-events:none;
    z-index:0;
  }

  header{
    position:relative;
    z-index:2;
    padding:14px 16px 12px;
    background:var(--paper-warm);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:32px;height:32px;
    border-radius:8px;
    background:linear-gradient(160deg, var(--amber), var(--amber-deep));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Lora',serif;font-weight:700;font-size:15px;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(184,127,28,0.35);
  }
  .brand h1{
    font-family:'Lora',serif;
    font-size:17px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .brand-sub{
    flex:1;
    min-width:0;
  }
  .brand-sub p{
    margin:0;
    font-size:11.5px;
    color:var(--ink-soft);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .gear-btn{
    width:32px;height:32px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:15px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }

  #settings-panel{
    display:none;
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  #settings-panel.open{ display:block; }
  .keyrow{
    display:flex;
    gap:8px;
  }
  .keyrow input{
    flex:1;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:9px 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
  }
  .keyrow button{
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:9px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .key-status{
    font-size:11px;
    margin-top:6px;
    color:var(--ink-soft);
  }
  .key-status.ok{ color:#3E7D4E; }

  main{
    flex:1;
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  #doc-chip-row{
    padding:8px 12px 0;
    display:none;
  }
  #doc-chip-row.show{ display:flex; }
  .doc-chip{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:12px;
  }
  .doc-chip .doc-icon{
    width:22px;height:22px;
    border-radius:5px;
    background:var(--slate-soft);
    color:var(--slate);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:700;
    flex-shrink:0;
  }
  .doc-chip .doc-name{
    max-width:140px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:600;
  }
  .doc-chip .doc-pages{ color:var(--ink-soft); }
  .doc-chip .doc-remove{
    color:var(--ink-soft);
    font-size:13px;
    padding:0 2px;
  }

  #messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  #empty-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:8px;
    padding:24px;
    color:var(--ink-soft);
  }
  #empty-state .empty-icon{
    font-family:'Lora',serif;
    font-size:26px;
    color:var(--ink);
    margin-bottom:4px;
  }
  #empty-state p{
    font-size:13px;
    max-width:280px;
    line-height:1.5;
    margin:0;
  }
  #empty-state .hint{
    font-size:12px;
    color:var(--amber-deep);
    font-weight:600;
  }

  .msg{
    max-width:86%;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg.ai{ align-self:flex-start; align-items:flex-start; }
  .bubble{
    padding:11px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .msg.user .bubble{
    background:var(--ink);
    color:var(--paper);
    border-bottom-right-radius:4px;
  }
  .msg.ai .bubble{
    background:var(--card);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .msg.ai .bubble.error{
    border-color:rgba(180,71,47,0.4);
    background:rgba(180,71,47,0.06);
    color:var(--danger);
  }
  .msg.ai .bubble.system{
    background:var(--slate-soft);
    border-color:transparent;
    color:var(--slate);
    font-size:13px;
  }
  .citations{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .citation-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    font-weight:600;
    padding:3px 8px 3px 7px;
    border-radius:4px 4px 4px 0;
    background:linear-gradient(160deg, #F6D998, #EBBD5C);
    color:#5C3D0A;
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
  }
  .thinking{
    display:flex;
    gap:4px;
    padding:14px 14px;
  }
  .thinking span{
    width:6px;height:6px;border-radius:50%;
    background:var(--ink-soft);
    opacity:0.4;
    animation:blink 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2){ animation-delay:0.15s; }
  .thinking span:nth-child(3){ animation-delay:0.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:0.25; } 40%{ opacity:0.9; } }

  #composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:10px 12px;
    background:var(--paper-warm);
    border-top:1px solid var(--line);
  }
  #attach-btn{
    width:40px;height:40px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:20px;
    font-weight:600;
    flex-shrink:0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  #attach-btn.has-file{
    background:var(--amber-deep);
    border-color:var(--amber-deep);
    color:#fff;
  }
  #file-input{ display:none; }
  #composer textarea{
    flex:1;
    resize:none;
    border-radius:14px;
    border:1px solid var(--line);
    padding:11px 14px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:var(--card);
    color:var(--ink);
    max-height:96px;
  }
  #send-btn{
    width:40px;height:40px;
    border-radius:12px;
    border:none;
    background:var(--amber-deep);
    color:#fff;
    font-size:16px;
    flex-shrink:0;
    cursor:pointer;
  }
  #send-btn:disabled{
    background:var(--line);
    color:var(--ink-soft);
  }

  ::-webkit-scrollbar{ width:5px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">C</div>
    <div class="brand-sub">
      <h1>Ceta</h1>
      <p id="header-sub">Belum ada file &middot; ketuk + untuk lampirkan PDF</p>
    </div>
    <button class="gear-btn" id="gear-btn">&#9881;</button>
  </div>
  <div id="settings-panel">
    <div class="keyrow">
      <input type="password" id="api-key-input" placeholder="Tempel API key Gemini di sini">
      <button id="save-key-btn">Simpan</button>
    </div>
    <div class="key-status" id="key-status">Belum ada API key tersimpan.</div>
  </div>
</header>

<main>
  <div id="doc-chip-row">
    <div class="doc-chip">
      <div class="doc-icon">PDF</div>
      <div class="doc-name" id="doc-name">dokumen.pdf</div>
      <div class="doc-pages" id="doc-pages">0 hal.</div>
      <div class="doc-remove" id="doc-remove">&#10005;</div>
    </div>
  </div>

  <div id="empty-state">
    <div class="empty-icon">Ceta</div>
    <p>Langsung tanya apa saja. Kalau pertanyaannya soal isi sebuah PDF, ketuk ikon <strong>+</strong> di bawah buat lampirkan filenya dulu.</p>
    <div class="hint">Ketuk + untuk lampirkan PDF</div>
  </div>

  <div id="messages"></div>

  <div id="composer">
    <label id="attach-btn" for="file-input" title="Lampirkan PDF">+</label>
    <input type="file" id="file-input" accept="application/pdf,.pdf">
    <textarea id="question-input" rows="1" placeholder="Tulis pertanyaan..."></textarea>
    <button id="send-btn">&#8593;</button>
  </div>
</main>

<script>
let pdfLibReady = false;
try{
  if(typeof pdfjsLib !== 'undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.js';
    pdfLibReady = true;
  }
}catch(e){
  console.error('pdf.js gagal dimuat', e);
}

const state = {
  apiKey: localStorage.getItem('gemini_api_key') || '',
  pages: [],
  fileName: '',
};

const el = {
  gearBtn: document.getElementById('gear-btn'),
  settingsPanel: document.getElementById('settings-panel'),
  keyInput: document.getElementById('api-key-input'),
  saveKeyBtn: document.getElementById('save-key-btn'),
  keyStatus: document.getElementById('key-status'),
  headerSub: document.getElementById('header-sub'),
  docChipRow: document.getElementById('doc-chip-row'),
  docName: document.getElementById('doc-name'),
  docPages: document.getElementById('doc-pages'),
  docRemove: document.getElementById('doc-remove'),
  emptyState: document.getElementById('empty-state'),
  messages: document.getElementById('messages'),
  attachBtn: document.getElementById('attach-btn'),
  fileInput: document.getElementById('file-input'),
  questionInput: document.getElementById('question-input'),
  sendBtn: document.getElementById('send-btn'),
};

function refreshKeyStatus(){
  if(state.apiKey){
    el.keyStatus.textContent = 'API key tersimpan di HP ini.';
    el.keyStatus.classList.add('ok');
    el.keyInput.value = '';
    el.keyInput.placeholder = '•••••••••••••••• (tersimpan)';
  } else {
    el.keyStatus.textContent = 'Belum ada API key tersimpan.';
    el.keyStatus.classList.remove('ok');
  }
}
refreshKeyStatus();

if(!pdfLibReady){
  addAiMessage('Komponen pembaca PDF belum berhasil dimuat saat halaman ini dibuka. Coba refresh halaman sekali lagi. Kalau tetap begini, mungkin ada bagian jaringan yang memblokir sumber library-nya.', null, true);
}

el.gearBtn.addEventListener('click', () => {
  el.settingsPanel.classList.toggle('open');
});

el.saveKeyBtn.addEventListener('click', () => {
  const v = el.keyInput.value.trim();
  if(!v) return;
  state.apiKey = v;
  localStorage.setItem('gemini_api_key', v);
  refreshKeyStatus();
});

function updateHeaderSub(){
  if(state.fileName){
    el.headerSub.textContent = state.fileName + ' terlampir · ' + state.pages.length + ' hal.';
  } else {
    el.headerSub.textContent = 'Belum ada file · ketuk + untuk lampirkan PDF';
  }
}

el.fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  if(!pdfLibReady){
    addAiMessage('Komponen pembaca PDF gagal dimuat (biasanya karena koneksi internet lambat/terputus saat halaman dibuka). Coba refresh halaman ini dulu, pastikan internet stabil, lalu coba lampirkan file lagi.', null, true);
    return;
  }
  addSystemMessage('Membaca "' + file.name + '"...');
  try{
    await loadPdf(file);
    state.fileName = file.name;
    el.docName.textContent = state.fileName;
    el.docPages.textContent = state.pages.length + ' hal.';
    el.docChipRow.classList.add('show');
    el.attachBtn.classList.add('has-file');
    updateHeaderSub();
    addSystemMessage('"' + state.fileName + '" siap (' + state.pages.length + ' halaman). Silakan tanya isinya.');
  }catch(err){
    console.error(err);
    addAiMessage('Gagal membaca file ini. Pastikan formatnya PDF dan coba lagi.', null, true);
  }
});

el.docRemove.addEventListener('click', () => {
  state.pages = [];
  state.fileName = '';
  el.docChipRow.classList.remove('show');
  el.attachBtn.classList.remove('has-file');
  el.fileInput.value = '';
  updateHeaderSub();
  addSystemMessage('File dilepas. Kamu masih bisa tanya bebas, atau lampirkan PDF lain.');
});

async function loadPdf(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const text = content.items.map(it => it.str).join(' ').trim();
    pages.push({ pageNumber: i, text });
  }
  state.pages = pages;
}

function hideEmptyState(){
  el.emptyState.style.display = 'none';
}

function addUserMessage(text){
  hideEmptyState();
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  wrap.innerHTML = `<div class="bubble"></div>`;
  wrap.querySelector('.bubble').textContent = text;
  el.messages.appendChild(wrap);
  el.messages.scrollTop = el.messages.scrollHeight;
}

function addSystemMessage(text){
  hideEmptyState();
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  wrap.innerHTML = `<div class="bubble system"></div>`;
  wrap.querySelector('.bubble').textContent = text;
  el.messages.appendChild(wrap);
  el.messages.scrollTop = el.messages.scrollHeight;
}

function addAiMessage(text, citedPages, isError){
  hideEmptyState();
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isError ? ' error' : '');
  bubble.textContent = text;
  wrap.appendChild(bubble);
  if(citedPages && citedPages.length){
    const tags = document.createElement('div');
    tags.className = 'citations';
    citedPages.forEach(p => {
      const tag = document.createElement('span');
      tag.className = 'citation-tag';
      tag.textContent = 'hal. ' + p;
      tags.appendChild(tag);
    });
    wrap.appendChild(tags);
  }
  el.messages.appendChild(wrap);
  el.messages.scrollTop = el.messages.scrollHeight;
  return wrap;
}

function addThinking(){
  hideEmptyState();
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  wrap.innerHTML = `<div class="bubble thinking"><span></span><span></span><span></span></div>`;
  el.messages.appendChild(wrap);
  el.messages.scrollTop = el.messages.scrollHeight;
  return wrap;
}

el.questionInput.addEventListener('input', () => {
  el.questionInput.style.height = 'auto';
  el.questionInput.style.height = Math.min(el.questionInput.scrollHeight, 96) + 'px';
});
el.questionInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleAsk();
  }
});
el.sendBtn.addEventListener('click', handleAsk);

async function handleAsk(){
  const question = el.questionInput.value.trim();
  if(!question) return;
  if(!state.apiKey){
    addAiMessage('Tempel dan simpan API key Gemini dulu lewat ikon gerigi di pojok kanan atas, ya.', null, true);
    return;
  }
  addUserMessage(question);
  el.questionInput.value = '';
  el.questionInput.style.height = 'auto';
  const thinkingEl = addThinking();

  try{
    const { answer, citedPages } = await askGemini(question, state.pages, state.apiKey);
    thinkingEl.remove();
    addAiMessage(answer, citedPages, false);
  }catch(err){
    console.error(err);
    thinkingEl.remove();
    addAiMessage('Gagal mendapat jawaban. Cek API key atau koneksi internet, lalu coba lagi. Detail: ' + err.message, null, true);
  }
}

async function askGemini(question, pages, apiKey, attempt = 1){
  let systemPrompt;
  if(pages.length){
    const docText = pages.map(p => `[Halaman ${p.pageNumber}]\n${p.text}`).join('\n\n');
    systemPrompt = `Kamu adalah asisten yang menjawab pertanyaan berdasarkan isi dokumen di bawah ini jika pertanyaannya relevan dengan dokumen. Ikuti aturan ini:
1. Jika pertanyaan berkaitan dengan dokumen, jawab singkat dan jelas HANYA berdasarkan isi dokumen. Jangan mengarang informasi di luar dokumen. Jika jawabannya tidak ada di dokumen, katakan jawabannya tidak ditemukan di dokumen ini.
2. Jika pertanyaan tidak berkaitan dengan dokumen (pertanyaan umum), jawab seperti biasa secara singkat dan jelas.
3. Di akhir jawabanmu, WAJIB tambahkan baris baru persis berformat: SUMBER_HALAMAN: x,y,z (nomor halaman dokumen tempat kamu menemukan jawaban, dipisah koma, tanpa spasi, tanpa kata "halaman"). Jika jawabannya tidak berasal dari dokumen, tulis SUMBER_HALAMAN: -

DOKUMEN:
${docText}`;
  } else {
    systemPrompt = `Kamu adalah asisten yang menjawab pertanyaan secara singkat dan jelas. Di akhir jawabanmu, WAJIB tambahkan baris baru persis berformat: SUMBER_HALAMAN: -`;
  }

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [
          {
            role: 'user',
            parts: [{ text: systemPrompt + '\n\nPERTANYAAN:\n' + question }]
          }
        ]
      })
    }
  );

  if(res.status === 503 && attempt < 3){
    await new Promise(r => setTimeout(r, attempt * 1200));
    return askGemini(question, pages, apiKey, attempt + 1);
  }

  if(!res.ok){
    const errBody = await res.text();
    throw new Error(`HTTP ${res.status}: ${errBody.slice(0,200)}`);
  }

  const data = await res.json();
  const rawText = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';

  const match = rawText.match(/SUMBER_HALAMAN:\s*(.*)/i);
  let citedPages = [];
  let answer = rawText;
  if(match){
    answer = rawText.slice(0, match.index).trim();
    const raw = match[1].trim();
    if(raw && raw !== '-'){
      citedPages = raw.split(',').map(s => s.trim()).filter(Boolean);
    }
  }
  return { answer: answer || 'Tidak ada jawaban.', citedPages };
}
</script>
</body>
</html>
